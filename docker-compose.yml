services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartwarehouse-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: SmartWarehouse
      APP_ENV: local
      APP_DEBUG: "true"
      APP_TIMEZONE: Asia/Jakarta
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: smartwarehouse
      DB_USERNAME: smartwarehouse
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smartwarehouse

  db:
    image: mysql:8.0
    container_name: smartwarehouse-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    environment:
      TZ: Asia/Jakarta
      MYSQL_DATABASE: smartwarehouse
      MYSQL_USER: smartwarehouse
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "smartwarehouse", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - smartwarehouse

volumes:
  mysql_data:

networks:
  smartwarehouse:
    driver: bridge
